project_id = "gvftdfriujrkpptdueyb"

[functions.jobvance-guest-support]
verify_jwt = false
[functions.trigger-make-run]
enabled = false
verify_jwt = true
import_map = "./functions/trigger-make-run/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/trigger-make-run/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/trigger-make-run/*.html" ]

# New handlers validate the user's token with auth.getUser inside the handler.
# Disabling the legacy gateway JWT check supports current asymmetric signing keys.
# The Stripe handler instead authenticates the unmodified body with Stripe HMAC.
[functions.tailor-for-job]
enabled = true
verify_jwt = false
[functions.tailor-cv]
enabled = true
verify_jwt = false

[functions.get-entitlement]
enabled = true
verify_jwt = false

# Verifies auth.getUser in the handler; inert until META_CAPI_ACCESS_TOKEN is set.
[functions.meta-conversions]
enabled = true
verify_jwt = false

[functions.create-checkout]
enabled = true
verify_jwt = false

[functions.stripe-webhook]
enabled = true
verify_jwt = false

[functions.paddle-webhook]
enabled = true
verify_jwt = false

# The Dodo handler authenticates the unmodified body with Standard Webhooks HMAC.
[functions.dodo-webhook]
enabled = true
verify_jwt = false

# Authenticated owner/session-bound recurring Job Loop billing.
[functions.job-loop-billing]
enabled = true
verify_jwt = false

# Isolated Dodo Test Mode acceptance; separate opt-in configuration gates runtime.
[functions.job-loop-billing-test]
enabled = true
verify_jwt = false

[functions.dodo-webhook-test]
enabled = true
verify_jwt = false

[functions.check-email-provider]
enabled = false
verify_jwt = true

[functions.lemon-squeezy-webhook]
enabled = false
verify_jwt = true

# Control verifies auth.getUser; worker uses its fixed server credential.
# OAuth callback verifies an expiring, single-use, owner-bound state.
[functions.job-loop-control]
enabled = true
verify_jwt = false

[functions.job-loop-worker]
enabled = true
verify_jwt = false

[functions.job-loop-oauth]
enabled = true
verify_jwt = false

# Every admin action checks auth.getUser and a fresh private membership.
[functions.jobvance-admin]
enabled = true
verify_jwt = false

[functions.jobvance-marketing]
enabled = true
verify_jwt = false

# Internal review/status work consumes an action-bound, single-use owner ticket.
[functions.jobvance-review-worker]
enabled = true
verify_jwt = false

# Analytics intake: anonymous visits are allowed; a valid token in the body links the account.
[functions.jobvance-track]
enabled = true
verify_jwt = false
