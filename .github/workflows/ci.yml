name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run type check
      run: npm run typecheck

    - name: Run tests
      run: npm run test:run

    - name: Setup Deno for cloud handler checks
      uses: denoland/setup-deno@v2
      with:
        deno-version: '2.9.6'

    - name: Verify pinned CI authentication module
      run: node --test scripts/check-cloud-auth.test.mjs

    - name: Verify cloud authentication boundaries
      run: node scripts/check-cloud-auth.mjs

    - name: Verify first-party tracking intake
      run: deno test --frozen --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,ALLOWED_ORIGINS,APP_URL --config supabase/functions/jobvance-track/deno.json supabase/tests/jobvance-track-edge.deno.ts

    - name: Run build
      run: npm run build

    - name: Verify hosting responses
      run: node scripts/check-host-worker.mjs

    - name: Security audit
      run: npm audit --audit-level=moderate
